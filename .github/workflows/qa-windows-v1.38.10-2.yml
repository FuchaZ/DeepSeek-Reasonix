# One-off native Windows installer for tester handoff. This workflow is outside
# the public release control plane and always checks out the pinned main-v2 SHA.
name: QA Windows v1.38.10-2
run-name: QA Windows v1.38.10-2 from main-v2 964da45fce7f

on:
  push:
    branches: [codex/qa-windows-v1.38.10-2]
    paths: [.github/workflows/qa-windows-v1.38.10-2.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-windows-v1.38.10-2
  cancel-in-progress: false

env:
  SOURCE_SHA: 964da45fce7f4905f616b23233f9d1bc0111eb0c
  TEST_VERSION: v1.38.10-2

jobs:
  package:
    name: package and accept windows-x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout immutable main-v2 source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install NSIS
        shell: pwsh
        run: ./scripts/install-nsis.ps1

      - name: Build Windows x64 installer
        run: scripts/desktop-build.sh windows/amd64 "$TEST_VERSION" canary

      - name: Verify package structure and native shell handshake
        run: |
          node desktop/packaging/verify.mjs dist/Reasonix-windows-amd64.zip
          node desktop/packaging/smoke.mjs desktop/build/electron/windows-amd64/app \
            --service desktop/build/bin/reasonix-desktop.exe --timeout 90

      - name: Accept final installer on disposable Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go -C desktop build -o "$env:RUNNER_TEMP/windows-upgrade-fixture.exe" ./cmd/windows-upgrade-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build the Windows upgrade fixture.' }
          ./scripts/test-windows-installer-startup.ps1 `
            -InstallerPath dist/Reasonix-windows-amd64-installer.exe `
            -ExpectedVersion $env:TEST_VERSION `
            -FixtureBuilderPath "$env:RUNNER_TEMP/windows-upgrade-fixture.exe" `
            -EvidenceDirectory "$env:RUNNER_TEMP/reasonix-installer-acceptance" `
            -DisposableEnvironment

      - name: Record source identity, checksum and handoff notes
        run: |
          (
            cd dist
            sha256sum Reasonix-windows-amd64-installer.exe > SHA256SUMS.txt
          )
          cp "$RUNNER_TEMP/reasonix-installer-acceptance/acceptance.json" dist/INSTALLER-ACCEPTANCE.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const name = 'Reasonix-windows-amd64-installer.exe';
          const bytes = fs.readFileSync(`dist/${name}`);
          const manifest = {
            version: process.env.TEST_VERSION,
            channel: 'canary',
            platform: 'windows/amd64',
            sourceRepository: 'esengine/DeepSeek-Reasonix',
            sourceRevision: process.env.SOURCE_SHA,
            testingOnly: true,
            productionSigned: false,
            nativeAcceptance: true,
            workflowRun: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            artifacts: [{
              name,
              size: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
            }],
          };
          fs.writeFileSync('dist/BUILD-INFO.json', `${JSON.stringify(manifest, null, 2)}\n`);
          fs.writeFileSync('dist/README-TEST.txt', [
            `${manifest.version} Windows x64 internal test installer`,
            `Source: ${manifest.sourceRepository}@${manifest.sourceRevision}`,
            'For internal testing only; this is not an official Stable release.',
            'The Windows installer is unsigned.',
            'The installer passed package checks, the native shell/service handshake, and native installer acceptance.',
            'Exit any running Reasonix instance before installing.',
            'SHA256SUMS.txt verifies the installer bytes.',
            '',
          ].join('\n'));
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Upload downloadable internal installer
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: Reasonix-v1.38.10-2-windows-x64-internal-installer
          path: |
            dist/Reasonix-windows-amd64-installer.exe
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json
            dist/INSTALLER-ACCEPTANCE.json
            dist/README-TEST.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Write handoff summary
        run: |
          {
            echo '### Reasonix v1.38.10-2 Windows x64 internal installer'
            echo
            echo 'Download: ${{ steps.upload.outputs.artifact-url }}'
            echo "Source: $SOURCE_SHA"
            echo "Version: $TEST_VERSION"
            echo 'Channel: canary; unsigned; testing only'
            echo 'Acceptance: package structure, native shell/service handshake, fresh install, suffix reinstall, legacy data upgrade, clean uninstall, and user-data retention passed.'
          } >> "$GITHUB_STEP_SUMMARY"
