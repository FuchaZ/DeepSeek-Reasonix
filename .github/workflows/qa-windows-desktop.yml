# One-off QA packaging for tester handoff. Not part of the release control plane.
# The source ref and version are pinned so the produced binaries match the
# requested main-v2 tip and can be traced independently of a public release.
name: QA Windows desktop package

on:
  push:
    branches: [chore/qa-windows-v1.38.11-1]

permissions:
  contents: read

env:
  SOURCE_SHA: 8ad1f01bdfb6c7a47e115335909654b51eceb82f
  QA_VERSION: v1.38.11-1

jobs:
  package:
    name: package windows-amd64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify pinned source
        run: git merge-base --is-ancestor "$SOURCE_SHA" HEAD

      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install NSIS
        run: pwsh -NoProfile -File scripts/install-nsis.ps1

      - name: Build Windows installer and portable archive
        timeout-minutes: 30
        run: scripts/desktop-build.sh windows/amd64 "$QA_VERSION" canary

      - name: Verify packaged artifacts
        run: |
          node desktop/packaging/verify.mjs dist/Reasonix-windows-amd64.zip
          sha256sum \
            dist/Reasonix-windows-amd64-installer.exe \
            dist/Reasonix-windows-amd64.zip \
            > dist/SHA256SUMS.txt
          {
            echo "QA Windows desktop package"
            echo "source_sha=$SOURCE_SHA"
            echo "version=$QA_VERSION"
            echo "platform=windows/amd64"
            echo "channel=canary"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "unsigned=true"
            echo "note=Tester build from the pinned main-v2 tip; not an official signed release."
            echo
            cat dist/SHA256SUMS.txt
          } | tee dist/QA-HANDOFF.txt

      - name: Install and smoke-test Windows installer identity
        shell: pwsh
        run: |
          go -C desktop build -o "$env:RUNNER_TEMP/windows-upgrade-fixture.exe" ./cmd/windows-upgrade-fixture
          ./scripts/test-windows-installer-startup.ps1 `
            -InstallerPath dist/Reasonix-windows-amd64-installer.exe `
            -ExpectedVersion v1.38.11-1 `
            -FixtureBuilderPath "$env:RUNNER_TEMP/windows-upgrade-fixture.exe" `
            -EvidenceDirectory "$env:RUNNER_TEMP/reasonix-installer-acceptance"

      - name: Profile installed desktop at idle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'reasonix-idle-cpu-install'
          $home = Join-Path $env:RUNNER_TEMP 'reasonix-idle-cpu-home'
          $evidence = Join-Path $env:RUNNER_TEMP 'reasonix-idle-cpu'
          New-Item -ItemType Directory -Force -Path $install,$home,$evidence | Out-Null
          $installer = (Resolve-Path 'dist/Reasonix-windows-amd64-installer.exe').Path
          $installed = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$install") -PassThru -Wait
          if ($installed.ExitCode -ne 0) { throw "diagnostic install failed: $($installed.ExitCode)" }
          $env:REASONIX_HOME = $home
          $env:REASONIX_QA_CPU_PROFILE = Join-Path $evidence 'service.pprof'
          Start-Process -FilePath (Join-Path $install 'Reasonix.exe') | Out-Null
          Start-Sleep -Seconds 15
          function Read-ReasonixProcesses {
            @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($install, [StringComparison]::OrdinalIgnoreCase) })
          }
          $beforeRows = Read-ReasonixProcesses
          $beforeCpu = @{}
          foreach ($row in $beforeRows) {
            $process = Get-Process -Id $row.ProcessId -ErrorAction SilentlyContinue
            if ($process) { $beforeCpu[$row.ProcessId] = $process.CPU }
          }
          Start-Sleep -Seconds 50
          $afterRows = Read-ReasonixProcesses
          $logical = [Environment]::ProcessorCount
          $samples = foreach ($row in $afterRows) {
            $process = Get-Process -Id $row.ProcessId -ErrorAction SilentlyContinue
            if (-not $process) { continue }
            $startCpu = $beforeCpu[$row.ProcessId]
            $delta = if ($null -eq $startCpu) { $null } else { [Math]::Max(0, $process.CPU - $startCpu) }
            [pscustomobject]@{
              pid = $row.ProcessId
              parentPid = $row.ParentProcessId
              executable = $row.ExecutablePath.Substring($install.Length).TrimStart('\')
              commandLine = $row.CommandLine
              cpuSeconds = $delta
              cpuPercentOneCore = if ($null -eq $delta) { $null } else { [Math]::Round(100 * $delta / 50, 2) }
              cpuPercentMachine = if ($null -eq $delta) { $null } else { [Math]::Round(100 * $delta / 50 / $logical, 2) }
              workingSetMb = [Math]::Round($process.WorkingSet64 / 1MB, 2)
            }
          }
          [pscustomobject]@{ logicalProcessors = $logical; intervalSeconds = 50; processes = @($samples) } |
            ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $evidence 'processes.json')
          $profile = Join-Path $evidence 'service.pprof'
          if (-not (Test-Path $profile)) { throw 'Go service CPU profile was not written' }
          go tool pprof -top -nodecount=100 $profile | Set-Content -Encoding utf8 (Join-Path $evidence 'service-pprof-top.txt')
          $logs = Join-Path $home 'desktop-shell/logs'
          if (Test-Path $logs) { Copy-Item -Recurse -Force $logs (Join-Path $evidence 'logs') }
          Get-Content (Join-Path $evidence 'processes.json')
          Get-Content (Join-Path $evidence 'service-pprof-top.txt')
          Get-Process -Name Reasonix,reasonix-desktop,reasonix-launcher -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload Windows idle CPU evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Reasonix-windows-amd64-v1.38.11-1-idle-cpu
          path: ${{ runner.temp }}/reasonix-idle-cpu/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Reasonix-windows-amd64-v1.38.11-1-acceptance
          path: |
            ${{ runner.temp }}/reasonix-installer-acceptance/**/*.json
            ${{ runner.temp }}/reasonix-installer-acceptance/**/*.png
            ${{ runner.temp }}/reasonix-installer-acceptance/**/*.log
            !${{ runner.temp }}/reasonix-installer-acceptance/installed/**
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: Reasonix-windows-amd64-v1.38.11-1
          path: |
            dist/Reasonix-windows-amd64-installer.exe
            dist/Reasonix-windows-amd64.zip
            dist/SHA256SUMS.txt
            dist/QA-HANDOFF.txt
          if-no-files-found: error
          retention-days: 14
